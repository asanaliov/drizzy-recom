<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drizzy Recom</title>
  <meta name="description" content="Pick a mood, get five Drake songs that fit it.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,400;1,6..96,500&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <a class="wordmark" href="#" data-home><img class="owl" src="images/owl.png" alt="" width="400" height="484"><span>Drizzy <em>recom</em></span></a>
    <span class="count" data-count></span>
  </header>

  <main>
    <section class="hero">
      <div class="picker" aria-labelledby="picker-heading">
        <h1 id="picker-heading">What's the mood?</h1>
        <div class="moods" role="group" aria-label="Moods" data-moods></div>
      </div>
      <div class="orbit-wrap" aria-hidden="true">
        <div class="orbit" data-orbit></div>
        <img class="owl owl-center" src="images/owl.png" alt="" width="400" height="484">
      </div>
    </section>

    <section class="result" data-result hidden aria-live="polite">
      <div class="result-head">
        <h2 class="result-mood" data-mood-name></h2>
        <p class="result-line" data-mood-line></p>
      </div>
      <ol class="tracks" data-tracks></ol>
      <div class="actions">
        <button type="button" class="btn" data-shuffle>Five more</button>
        <button type="button" class="btn ghost" data-copy>Copy link</button>
      </div>
    </section>
  </main>

  <footer class="foot">
    <p>Tracks link out to YouTube and Spotify search. Album art from Apple Music. Pools are hand-picked and opinionated.</p>
  </footer>

  <script src="moods.js"></script>
  <script src="covers.js"></script>
  <script src="app.js"></script>
</body>
</html>

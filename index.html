<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drake by Mood</title>
  <meta name="description" content="Pick a mood, get five Drake songs that fit it.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="owl-favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,400;1,6..96,500&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <a class="wordmark" href="#" data-home><svg class="owl" viewBox="0 0 100 110" fill="none" aria-hidden="true" focusable="false"><path fill="#d4af37" d="M22 12 L34 26 C44 20 56 20 66 26 L78 12 L76 42 C84 56 84 72 76 86 C68 104 32 104 24 86 C16 72 16 56 24 42 Z"/><circle cx="36" cy="52" r="14" fill="#000"/><circle cx="64" cy="52" r="14" fill="#000"/><circle cx="36" cy="52" r="9" fill="#d4af37"/><circle cx="64" cy="52" r="9" fill="#d4af37"/><circle cx="36" cy="52" r="4.5" fill="#000"/><circle cx="64" cy="52" r="4.5" fill="#000"/><path d="M50 61 L44.5 71 L55.5 71 Z" fill="#000"/><path d="M40 82 L50 88 L60 82 M42 92 L50 97 L58 92" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Drake <em>by mood</em></span></a>
    <span class="count" data-count></span>
  </header>

  <main>
    <section class="picker" aria-labelledby="picker-heading">
      <svg class="owl owl-hero" viewBox="0 0 100 110" fill="none" aria-hidden="true" focusable="false"><path fill="#d4af37" d="M22 12 L34 26 C44 20 56 20 66 26 L78 12 L76 42 C84 56 84 72 76 86 C68 104 32 104 24 86 C16 72 16 56 24 42 Z"/><circle cx="36" cy="52" r="14" fill="#000"/><circle cx="64" cy="52" r="14" fill="#000"/><circle cx="36" cy="52" r="9" fill="#d4af37"/><circle cx="64" cy="52" r="9" fill="#d4af37"/><circle cx="36" cy="52" r="4.5" fill="#000"/><circle cx="64" cy="52" r="4.5" fill="#000"/><path d="M50 61 L44.5 71 L55.5 71 Z" fill="#000"/><path d="M40 82 L50 88 L60 82 M42 92 L50 97 L58 92" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h1 id="picker-heading">What's the mood?</h1>
      <div class="moods" role="group" aria-label="Moods" data-moods></div>
    </section>

    <section class="result" data-result hidden aria-live="polite">
      <p class="result-mood"><span data-mood-name></span></p>
      <p class="result-line" data-mood-line></p>
      <ol class="tracks" data-tracks></ol>
      <div class="actions">
        <button type="button" class="btn" data-shuffle>Five more</button>
        <button type="button" class="btn ghost" data-copy>Copy link</button>
      </div>
    </section>
  </main>

  <footer class="foot">
    <p>Tracks link out to YouTube and Spotify search. Pools are hand-picked and opinionated.</p>
  </footer>

  <script src="moods.js"></script>
  <script src="app.js"></script>
</body>
</html>
